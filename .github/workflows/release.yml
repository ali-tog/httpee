name: Generate SLSA provenance and release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write # required for SLSA provenance

jobs:
  release:
    uses: slsa-framework/slsa-github-generator/.github/workflows/builder_goreleaser_slsa3.yml@v2.0.0
    with:
      go-version: stable
    secrets:
      goreleaser-token: ${{ secrets.GITHUB_TOKEN }}
