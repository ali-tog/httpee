version: 2
project_name: httpee

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    main: ./main.go
    binary: 'httpee-{{ title .Os }}-{{ if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}'

archives:
  - format: binary
    name_template: '{{ .Binary }}'

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
